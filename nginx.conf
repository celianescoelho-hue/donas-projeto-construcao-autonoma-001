# Donas Build apps with ai — Nginx reverse proxy for a VPS deploy.
# Routes /api/* to the FastAPI backend and everything else to the React app.
# Fill in your domain and (for HTTPS) point the certs volume at your certificates.

upstream donas_backend { server backend:8001; }
upstream donas_frontend { server frontend:3000; }

server {
    listen 80;
    server_name _;            # replace with your domain, e.g. donas.suaempresa.com

    client_max_body_size 25m; # uploads (10 MB files) + headroom

    # Backend API
    location /api/ {
        proxy_pass http://donas_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Streaming (chat SSE): disable buffering and keep the connection open.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # React app (static build served by its own container)
    location / {
        proxy_pass http://donas_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- HTTPS (recommended) ----
